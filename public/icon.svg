<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Glowing Sparkle / Persona Symbol -->
  <g transform="translate(256, 256)">
    <!-- Aura -->
    <circle r="140" fill="url(#glow)" opacity="0.15" filter="blur(20px)"/>
    
    <!-- Stylized 4-Point Star / Sparkle of Persona -->
    <path d="M 0 -130 Q 0 0 -130 0 Q 0 0 0 130 Q 0 0 130 0 Q 0 0 0 -130 Z" fill="url(#accent)"/>
    
    <!-- Inner Radiant Core -->
    <circle r="28" fill="#ffffff" opacity="0.95"/>
    <circle r="44" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
